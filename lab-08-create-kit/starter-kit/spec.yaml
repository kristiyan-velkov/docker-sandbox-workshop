# schemaVersion: kit spec v2 — see customize/SPEC-REFERENCE.md
schemaVersion: "2"
kind: mixin
name: my-workshop-kit
displayName: My workshop kit
description: >-
  Attendee kit from Lab 8 — customize install commands, network allows,
  and agentContext for your team.

# agentContext: appended to the agent memory file at sandbox start
agentContext: |
  Lab 8 custom kit is active.
  Run `npm run lint` before finishing any UI change.
  Never commit API keys — use host `.env.local` or `sbx secret set`.

caps:
  network:
    allow:
      - registry.npmjs.org
      - better-design.com
      - ikagquokcvhbdzmjcdjp.supabase.co

environment:
  variables:
    NEXT_TELEMETRY_DISABLED: "1"

commands:
  install:
    - command: "npm ci --no-audit --no-fund"
      user: "1000"
      description: Install workshop-app dependencies
